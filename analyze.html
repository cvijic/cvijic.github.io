<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>GSC Analyze</title></head>
<body>
<pre id="out">Loading...</pre>
<script>
(async () => {
  const out = document.getElementById('out');
  const log = [];
  try {
    const p = new URLSearchParams(location.search);
    const token = p.get('token');
    const site = p.get('site');
    const country = p.get('country') || 'srb';
    const PRE = { s: '2025-12-01', e: '2026-02-28' };
    const POST = { s: '2026-06-27', e: '2026-09-26' };

    async function q(start, end, dims) {
      const body = { startDate: start, endDate: end, dimensions: dims, rowLimit: 25000, dataState: 'all',
        dimensionFilterGroups: [{ filters: [{ dimension: 'country', operator: 'equals', expression: country }] }] };
      const url = 'https://www.googleapis.com/webmasters/v3/sites/' + encodeURIComponent(site)
        + '/searchAnalytics/query?access_token=' + encodeURIComponent(token);
      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const j = await r.json();
      if (!r.ok) throw new Error('HTTP ' + r.status + ': ' + JSON.stringify(j).slice(0, 300));
      return j.rows || [];
    }

    const [qpPre, qpPost, byDate] = await Promise.all([
      q(PRE.s, PRE.e, ['query', 'page']),
      q(POST.s, POST.e, ['query', 'page']),
      q('2025-12-01', '2026-09-26', ['date'])
    ]);

    function agg(rows) {
      let c = 0, i = 0, wp = 0;
      for (const r of rows) { c += r.clicks; i += r.impressions; wp += r.position * r.impressions; }
      return { clicks: Math.round(c), impr: Math.round(i), pos: i ? (wp / i).toFixed(1) : '-', queries: new Set(rows.map(r => r.keys[0])).size };
    }
    const aPre = agg(qpPre), aPost = agg(qpPost);

    log.push('=== SUMMARY (SRB, pre ' + PRE.s + '..' + PRE.e + ' vs posle ' + POST.s + '..' + POST.e + ') ===');
    log.push('PRE:   clicks=' + aPre.clicks + ' impr=' + aPre.impr + ' avgPos=' + aPre.pos + ' uniqueQueries=' + aPre.queries);
    log.push('POSLE: clicks=' + aPost.clicks + ' impr=' + aPost.impr + ' avgPos=' + aPost.pos + ' uniqueQueries=' + aPost.queries);
    if (aPre.clicks > 0) log.push('RAST: x' + (aPost.clicks / aPre.clicks).toFixed(2) + ' klikovi, x' + (aPost.impr / aPre.impr).toFixed(2) + ' impresije');

    // monthly trend
    const months = {};
    for (const r of byDate) { const m = r.keys[0].slice(0, 7); (months[m] = months[m] || { c: 0, i: 0 }); months[m].c += r.clicks; months[m].i += r.impressions; }
    log.push('\n=== TREND PO MESECIMA (SRB) ===');
    for (const m of Object.keys(months).sort()) log.push(m + ': clicks=' + Math.round(months[m].c) + ' impr=' + Math.round(months[m].i));

    // query aggregates (post)
    function qAgg(rows) {
      const m = {};
      for (const r of rows) {
        const k = r.keys[0];
        (m[k] = m[k] || { c: 0, i: 0, wp: 0 });
        m[k].c += r.clicks; m[k].i += r.impressions; m[k].wp += r.position * r.impressions;
      }
      return m;
    }
    const qPre = qAgg(qpPre), qPost = qAgg(qpPost);
    const top = Object.entries(qPost).sort((a, b) => b[1].c - a[1].c).slice(0, 40);
    log.push('\n=== TOP 40 UPITA POSLE (clicks | impr | pos || PRE: clicks|pos) ===');
    for (const [k, v] of top) {
      const pre = qPre[k];
      log.push(k + ' | ' + Math.round(v.c) + ' | ' + Math.round(v.i) + ' | ' + (v.wp / v.i).toFixed(1) + (pre ? ' || ' + Math.round(pre.c) + ' | ' + (pre.wp / pre.i).toFixed(1) : ' || (nije bilo)'));
    }

    // cannibalization (post): query with 2+ pages, each >=5 impr
    const byQ = {};
    for (const r of qpPost) { (byQ[r.keys[0]] = byQ[r.keys[0]] || []).push({ page: r.keys[1], i: r.impressions, c: r.clicks, pos: r.position }); }
    const cann = Object.entries(byQ)
      .map(([k, arr]) => ({ k, arr: arr.filter(x => x.i >= 5) }))
      .filter(x => x.arr.length >= 2)
      .sort((a, b) => b.arr.reduce((s, x) => s + x.i, 0) - a.arr.reduce((s, x) => s + x.i, 0))
      .slice(0, 20);
    log.push('\n=== KANIBALIZACIJA (query -> 2+ stranica, top 20 po impresijama) ===');
    for (const x of cann) {
      log.push('QUERY: ' + x.k);
      for (const pg of x.arr.sort((a, b) => b.i - a.i)) log.push('   ' + pg.page.replace(/^https?:\/\/[^/]+/, '') + ' | impr=' + Math.round(pg.i) + ' clicks=' + Math.round(pg.c) + ' pos=' + pg.pos.toFixed(1));
    }

    // striking distance: pos 4-15, impr>=20
    const sd = Object.entries(qPost)
      .filter(([k, v]) => { const pos = v.wp / v.i; return pos >= 4 && pos <= 15 && v.i >= 20; })
      .sort((a, b) => b[1].i - a[1].i).slice(0, 30);
    log.push('\n=== STRIKING DISTANCE (pos 4-15, impr>=20, top 30) ===');
    for (const [k, v] of sd) log.push(k + ' | impr=' + Math.round(v.i) + ' clicks=' + Math.round(v.c) + ' pos=' + (v.wp / v.i).toFixed(1));

    log.push('\nROWS: qpPre=' + qpPre.length + ' qpPost=' + qpPost.length + ' byDate=' + byDate.length);
    out.textContent = log.join('\n');
  } catch (e) {
    out.textContent = log.join('\n') + '\nJS ERROR: ' + e.message;
  }
})();
</script>
</body>
</html>
