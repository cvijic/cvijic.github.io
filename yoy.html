<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>GSC YoY</title></head>
<body>
<pre id="out">Loading...</pre>
<script>
(async () => {
  const out = document.getElementById('out');
  try {
    const p = new URLSearchParams(location.search);
    const token = p.get('token');
    const site = p.get('site');
    const country = p.get('country') || 'srb';
    const body = { startDate: '2025-06-01', endDate: '2026-09-26', dimensions: ['date'], rowLimit: 25000, dataState: 'all',
      dimensionFilterGroups: [{ filters: [{ dimension: 'country', operator: 'equals', expression: country }] }] };
    const url = 'https://www.googleapis.com/webmasters/v3/sites/' + encodeURIComponent(site)
      + '/searchAnalytics/query?access_token=' + encodeURIComponent(token);
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok) throw new Error('HTTP ' + r.status + ': ' + JSON.stringify(j).slice(0, 300));
    const months = {};
    for (const row of (j.rows || [])) {
      const m = row.keys[0].slice(0, 7);
      (months[m] = months[m] || { c: 0, i: 0 });
      months[m].c += row.clicks; months[m].i += row.impressions;
    }
    const lines = ['MESEC | clicks | impr'];
    for (const m of Object.keys(months).sort()) lines.push(m + ' | ' + Math.round(months[m].c) + ' | ' + Math.round(months[m].i));
    out.textContent = lines.join('\n');
  } catch (e) {
    out.textContent = 'JS ERROR: ' + e.message;
  }
})();
</script>
</body>
</html>
